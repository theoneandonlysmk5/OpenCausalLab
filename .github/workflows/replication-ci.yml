name: replication-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  public:
    name: Public CI (no microdata)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (replication + dev; no causal-ml)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[replication,dev]'

      - name: Lint
        run: python -m compileall -q opencausallab studies/lakdawala2025/src

      - name: Public tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/studies/lakdawala2025
        run: |
          pytest -q -m "not microdata and not causal_ml" --tb=short

      - name: Replication gate (committed artifacts)
        working-directory: studies/lakdawala2025
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/studies/lakdawala2025
        run: python scripts/ci_gate.py

  with-microdata:
    name: Local-data CI (optional HHsurvey)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: public
    if: ${{ github.event_name != 'pull_request' || vars.RUN_MICRODATA_CI == 'true' }}
    defaults:
      run:
        working-directory: studies/lakdawala2025

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install full stack
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[all]'

      - name: Restore HHsurvey (optional secret)
        env:
          HHSURVEY_PARQUET_URL: ${{ secrets.HHSURVEY_PARQUET_URL }}
        run: |
          mkdir -p data/final
          if [ -n "${HHSURVEY_PARQUET_URL}" ]; then
            curl -fsSL "${HHSURVEY_PARQUET_URL}" -o data/final/HHsurvey.parquet
          else
            echo "No HHSURVEY_PARQUET_URL — gate will skip live rebuild."
          fi

      - name: Replication gate + microdata tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/studies/lakdawala2025
        run: |
          python scripts/ci_gate.py
          if [ -f data/final/HHsurvey.parquet ]; then
            pytest -q -m "not causal_ml" --tb=short
          fi
