name: replication-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  replication:
    name: Replication CI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: studies/lakdawala2025

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore HHsurvey (optional secret)
        env:
          HHSURVEY_PARQUET_URL: ${{ secrets.HHSURVEY_PARQUET_URL }}
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/studies/lakdawala2025
        run: |
          mkdir -p data/final
          if [ -n "${HHSURVEY_PARQUET_URL}" ]; then
            curl -fsSL "${HHSURVEY_PARQUET_URL}" -o data/final/HHsurvey.parquet
          fi

      - name: Replication gate
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/studies/lakdawala2025
        run: python scripts/ci_gate.py

      - name: Coverage (unit)
        working-directory: .
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/studies/lakdawala2025
        run: |
          pytest studies/lakdawala2025/tests/test_stata_round.py -q --cov=core --cov-report=xml
        continue-on-error: true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-outputs
          path: |
            studies/lakdawala2025/data/final/tables/table3*.csv
            studies/lakdawala2025/data/final/validation/
            coverage.xml
          if-no-files-found: warn
