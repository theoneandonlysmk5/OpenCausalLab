[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencausallab"
version = "0.1.0"
description = "Open framework for independently verifying empirical economics research in Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sheng Huo" }]

[tool.setuptools.packages.find]
include = ["core*"]

[tool.pytest.ini_options]
testpaths = ["studies/lakdawala2025/tests"]
pythonpath = [".", "studies/lakdawala2025"]

[tool.coverage.run]
source = ["core", "studies/lakdawala2025/src"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["core", "studies/lakdawala2025/src", "studies/lakdawala2025/scripts"]

[tool.black]
line-length = 100
target-version = ["py310"]
