[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencausallab"
version = "0.1.0"
description = "Open framework for independently verifying empirical economics research in Python"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Sheng Huo" }]
dependencies = [
    "numpy==2.2.6",
    "pandas==2.3.3",
    "scipy==1.15.3",
    "statsmodels==0.14.6",
]

[project.optional-dependencies]
io = [
    "pyarrow==25.0.0",
    "pyreadstat==1.3.5",
]
replication = [
    "pyarrow==25.0.0",
    "pyreadstat==1.3.5",
]
causal-ml = [
    "scikit-learn==1.7.2",
    "econml==0.17.0",
]
dev = [
    "pytest==9.1.1",
    "pytest-cov>=5,<7",
    "ruff>=0.8",
    "black>=24",
]
all = [
    "pyarrow==25.0.0",
    "pyreadstat==1.3.5",
    "scikit-learn==1.7.2",
    "econml==0.17.0",
    "pytest==9.1.1",
    "pytest-cov>=5,<7",
    "ruff>=0.8",
    "black>=24",
]

[tool.setuptools.packages.find]
include = ["opencausallab*"]

[tool.pytest.ini_options]
testpaths = ["tests", "studies/lakdawala2025/tests"]
pythonpath = [".", "studies/lakdawala2025"]
markers = [
    "microdata: requires downloaded Dataverse microdata or built intermediates",
    "causal_ml: requires optional causal-ML dependencies (econml)",
    "slow: long-running integration test",
]

[tool.coverage.run]
source = ["opencausallab", "studies/lakdawala2025/src"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["opencausallab", "studies/lakdawala2025/src", "studies/lakdawala2025/scripts", "tests"]

[tool.black]
line-length = 100
target-version = ["py310"]
